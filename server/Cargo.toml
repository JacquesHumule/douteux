[package]
name = "douteux"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
s3-presign = "0.0.3"
worker = { version = "0.8", features = ['http', 'axum'] }
worker-macros = { version = "0.8", features = ['http'] }
axum = { version = "0.8", default-features = false, features = ["json", "macros", "query"] }
tower-service = "0.3.3"
futures-util = "0.3"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The exact query-string decoder `axum::extract::Query` uses, so tests exercise
# the real parser.
serde_urlencoded = "0.7"
